name: Service tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: melka
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: melka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U melka -d melka_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: ruff check backend telegram_bot tests android/build.py scripts
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://melka:ci-only-password@localhost:5432/melka_test
      - name: Execute the native menu adapter with mocked drawing APIs
        run: python android/native-ui/test_ui.py
      - name: Test the Android license lease
        run: |
          mkdir -p "$RUNNER_TEMP/license-tests"
          javac -d "$RUNNER_TEMP/license-tests" android/src/com/melkadlc/LicenseLease.java tests/java/LicenseLeaseTest.java
          java -cp "$RUNNER_TEMP/license-tests" com.melkadlc.LicenseLeaseTest
