[project]
name = "melkadlc-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1", "uvicorn==0.54.0", "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9", "alembic==1.20.1", "cryptography==50.0.2",
  "pydantic-settings==2.16.3", "aiogram==3.32.0", "httpx==0.28.1",
]
[project.optional-dependencies]
test = ["pytest==9.2.0", "ruff==0.17.5", "unicorn==2.1.4"]
[tool.setuptools.packages.find]
include = ["backend*", "telegram_bot*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
